name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Translation zone checks (manifest / license / attribution / status)
        run: node scripts/check-translation.mjs
      - name: Navigation coverage and public archive boundary
        run: node scripts/check-navigation.mjs
      - name: Prepare Quartz 5 source (pinned)
        run: bash scripts/bootstrap-quartz.sh .quartz-build
      - name: Install dependencies
        working-directory: .quartz-build
        run: npm ci
      - name: Install Quartz plugins
        working-directory: .quartz-build
        run: npx quartz plugin install --from-config
      - name: Content checks
        working-directory: .quartz-build
        run: node scripts/check-content.mjs
      - name: Build site
        working-directory: .quartz-build
        run: npx quartz build
      - name: Verify build output
        working-directory: .quartz-build
        run: node scripts/verify-build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .quartz-build/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-online:
    name: Enforce HTTPS and verify live Pages
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Require Pages HTTPS enforcement, valid TLS and HTTP redirect
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-https.sh
