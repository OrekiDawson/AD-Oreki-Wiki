name: KB PR check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: PR 原子化与范围提示
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 只读汇总 PR 元数据
        uses: actions/github-script@v9
        with:
          script: |
            const pr=context.payload.pull_request;
            const files=await github.paginate(github.rest.pulls.listFiles,{
              ...context.repo,pull_number:pr.number,per_page:100
            });
            let commits=[];
            try {
              commits=await github.paginate(github.rest.pulls.listCommits,{
                ...context.repo,pull_number:pr.number,per_page:100
              });
            } catch (err) {
              core.info("无法读取提交列表，继续使用标题与正文："+String(err?.message||err).slice(0,200));
            }
            const taskText=[pr.title,pr.body||"",...commits.map(c=>c.commit.message)].join("\n");
            const declaredTaskIds=[...new Set(taskText.match(
              /\bR\d{2,3}-(?:\d{2,3}\b|[^\s，。；、,.;:：()（）\[\]*_\/]+)/g
            )||[])];
            const bareRounds=[...new Set(taskText.match(/\bR\d{2,3}\b(?!-)/g)||[])];
            const taskIds=declaredTaskIds.length ? declaredTaskIds :
              bareRounds.map(id=>id+"（未带子编号）");
            const mechanical=path =>
              /\.gen\.(js|mjs|ts)$/i.test(path) ||
              /^(reports|test-results|playwright-report|reconstructed)\//i.test(path) ||
              /(^|\/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|gradle\.lockfile)$|(^|\/)(generated|build|dist|node_modules)\//i.test(path);
            let effective=0, generated=0;
            for(const f of files){
              const lines=(f.additions||0)+(f.deletions||0);
              if(mechanical(f.filename)) generated+=lines; else effective+=lines;
            }
            const warnings=[];
            if(taskIds.length>1) warnings.push(`检测到多个任务编号 ${taskIds.join("、")}；请证明属于同一不可拆分目标，否则拆分`);
            if(pr.changed_files>15) warnings.push(`修改文件 ${pr.changed_files} 个，超过目标阈值 15`);
            if(effective>400) warnings.push(`有效变更 ${effective} 行，超过目标阈值 400`);
            if(effective>800) warnings.push("有效变更超过 800 行；默认拆分，或记录不可拆分的原子理由");
            if(generated) warnings.push(`另有 ${generated} 行锁文件/生成物，已单独统计`);
            await core.summary
              .addHeading("PR 原子化与范围提示")
              .addRaw(`目标：${pr.title}\n\n文件：${pr.changed_files}；有效变更：${effective} 行；生成/锁文件：${generated} 行；任务编号：${taskIds.join("、")||"未声明"}`)
              .addRaw(`\n\n${warnings.length ? warnings.map(x=>"- "+x).join("\n") : "未触发范围预警。"}`)
              .write();
            core.info(warnings.join("；")||"PR 范围未触发预警");
  build:
    name: Wiki PR CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate retained daily AI scripts (syntax only; no model calls)
        run: |
          node --check scripts/ai/daily-guard.mjs
          node --check scripts/ai/lib.mjs
          node --check scripts/ai/sync.mjs
      - name: Check HTTPS verification script syntax
        run: bash -n scripts/verify-https.sh
      - name: HTTPS monitor regression tests (Node 24, no network or API calls)
        run: node --test scripts/tests/https-监控.test.mjs
      - name: Wiki path and title namespace regression tests
        run: node --test scripts/tests/wiki-paths.test.mjs
      - name: Translation zone checks (manifest / license / attribution / status)
        run: node scripts/check-translation.mjs
      - name: System font policy
        run: node scripts/check-fonts.mjs
      - name: Navigation coverage and public archive boundary
        run: node scripts/check-navigation.mjs
      - name: Public link policy (source)
        run: node scripts/check-public-links.mjs
      - name: MOD terminology policy (source)
        run: node scripts/check-mod-terminology.mjs
      - name: CJK spacing policy (source)
        run: node scripts/check-cjk-spacing.mjs
      - name: Title length and naming hard gate
        run: node scripts/check-title-length.mjs
      - name: No page transition animation or progress bar
        run: node scripts/check-motion.mjs
      - run: bash scripts/bootstrap-quartz.sh .quartz-build
      - run: npm ci
        working-directory: .quartz-build
      - run: npx quartz plugin install --from-config
        working-directory: .quartz-build
      - run: node scripts/check-content.mjs
        working-directory: .quartz-build
      - run: npx quartz build
        working-directory: .quartz-build
      - name: Built navigation DOM and empty-menu gate
        run: node scripts/check-navigation.mjs --built public
        working-directory: .quartz-build
      - name: Public link policy (built HTML)
        run: node scripts/check-public-links.mjs --built public
        working-directory: .quartz-build
      - name: MOD terminology policy (built HTML)
        run: node scripts/check-mod-terminology.mjs --built public
        working-directory: .quartz-build
      - name: CJK spacing policy (built HTML)
        run: node scripts/check-cjk-spacing.mjs --built public
        working-directory: .quartz-build
      - name: Built title length hard gate
        run: node scripts/check-title-length.mjs --built public
        working-directory: .quartz-build
      - name: Built font policy
        run: node scripts/check-fonts.mjs --built public
        working-directory: .quartz-build
      - run: node scripts/verify-build.mjs
        working-directory: .quartz-build
