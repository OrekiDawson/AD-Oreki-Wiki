<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 479" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">一轮自动化调度</title><desc id="desc">读取阶段与资源：识别当前目标和受管状态；筛选合法候选：检查解锁、资源、挑战限制；判断调度时机：检查全局节拍、冷却与手动让路；调用真实游戏入口：尝试合法购买或重置；记录实际结果：acted / no-op / fail。下一轮重新读取游戏状态；不伪造结算</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="477" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#23374b">一轮自动化调度</text><rect x="42" y="55" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">读取阶段与资源</text><text x="310" y="104" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">识别当前目标和受管状态</text><path d="M310 117 L310 131" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="133" width="536" height="61" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">筛选合法候选</text><text x="310" y="182" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">检查解锁、资源、挑战限制</text><path d="M310 195 L310 209" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="211" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="236" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">判断调度时机</text><text x="310" y="260" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">检查全局节拍、冷却与手动让路</text><path d="M310 273 L310 287" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="289" width="536" height="61" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="314" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">调用真实游戏入口</text><text x="310" y="338" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">尝试合法购买或重置</text><path d="M310 351 L310 365" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="367" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="392" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">记录实际结果</text><text x="310" y="416" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">acted / no-op / fail</text><text x="310" y="462" text-anchor="middle" font-size="18" font-weight="400" fill="#23374b">下一轮重新读取游戏状态；不伪造结算</text>
</svg>
