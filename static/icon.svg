<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">反物质维度 Wiki</title>
  <desc id="desc">由两条相反方向轨道和中心奇点组成的原创反物质标识</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5c6cff"/>
      <stop offset="1" stop-color="#20d6b5"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="64" fill="#11152b"/>
  <ellipse cx="128" cy="128" rx="86" ry="34" fill="none" stroke="url(#g)" stroke-width="12" transform="rotate(34 128 128)"/>
  <ellipse cx="128" cy="128" rx="86" ry="34" fill="none" stroke="#f5f7ff" stroke-opacity=".9" stroke-width="8" transform="rotate(-34 128 128)"/>
  <circle cx="128" cy="128" r="20" fill="#fff"/>
  <circle cx="128" cy="128" r="9" fill="#5c6cff"/>
</svg>
