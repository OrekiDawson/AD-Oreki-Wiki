<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 557" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">Android APK 组装流程</title><desc id="desc">settings.gradle.kts：注册 :app 与 build-logic；app/build.gradle.kts：解析版本、输入、source set 与变体；完整游戏输入：Kotlin、资源、Manifest、assets、JNI；AGP 任务图：编译、合并、资源处理与 DEX 转换；变体打包：debug / release / r8，核对签名处置；APK 产物：仍需安装、行为与交付验证。依据本文固定源码基线；非最新构建状态</desc>
