<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 505" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">双端行为一致性</title><desc id="desc">Android 和 Web 使用各自实现，基于等价输入、动作和时间条件比较真实结算、资源、阶段、可见行为及保存结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="503" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310" y="37" text-anchor="middle" font-size="27" font-weight="700" fill="#23374b">不同实现，共同的行为契约</text><rect x="55" y="62" width="510" height="60" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="99" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">等价输入、动作与时间条件</text><path d="M240 123 L159 154" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M380 123 L461 154" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="25" y="158" width="270" height="141" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="160" y="188" text-anchor="middle" font-size="27" font-weight="700" fill="#23374b">Android</text><text x="160" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#23374b">宿主运行时</text><text x="160" y="252" text-anchor="middle" font-size="20" font-weight="400" fill="#23374b">Kotlin 适配与调度</text><text x="160" y="282" text-anchor="middle" font-size="20" font-weight="400" fill="#23374b">合法动作、结算与保存</text><path d="M160 300 L310 345" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="325" y="158" width="270" height="141" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="460" y="188" text-anchor="middle" font-size="27" font-weight="700" fill="#23374b">Web</text><text x="460" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#23374b">浏览器游戏循环</text><text x="460" y="252" text-anchor="middle" font-size="20" font-weight="400" fill="#23374b">JavaScript 策略与执行</text><text x="460" y="282" text-anchor="middle" font-size="20" font-weight="400" fill="#23374b">合法动作、结算与保存</text><path d="M460 300 L310 345" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="350" width="544" height="105" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="383" text-anchor="middle" font-size="26" font-weight="700" fill="#23374b">共同检查点</text><text x="310" y="414" text-anchor="middle" font-size="22" font-weight="400" fill="#23374b">阶段、资源、保留项、界面</text><text x="310" y="441" text-anchor="middle" font-size="21" font-weight="400" fill="#23374b">下一步可用动作与读回状态</text><text x="310" y="485" text-anchor="middle" font-size="18" font-weight="400" fill="#23374b">契约示意，并非双端实测通过证明</text>
</svg>
