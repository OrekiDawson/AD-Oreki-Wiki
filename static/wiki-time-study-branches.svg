<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 412" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">时间研究的两类路线</title><desc id="desc">维度分叉的反物质、无限和时间维度路线，节奏分叉的主动、被动和闲置路线；初期各选一条，后期规则会改变。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="410" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310" y="36" font-size="27" fill="#192c40" text-anchor="middle" font-weight="700">时间研究：两类路线选择</text><rect x="158" y="58" width="304" height="43" rx="8" fill="#eaf1f7" stroke="#9eb4c6" stroke-width="1.5"/><text x="310" y="87" font-size="25" fill="#192c40" text-anchor="middle" font-weight="700">维度分叉</text><path d="M310 102 L110 131" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="22" y="134" width="176" height="44" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="110" y="164" font-size="23" fill="#192c40" text-anchor="middle" font-weight="700">反物质</text><path d="M310 102 L310 131" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="222" y="134" width="176" height="44" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="310" y="164" font-size="23" fill="#192c40" text-anchor="middle" font-weight="700">无限</text><path d="M310 102 L510 131" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="422" y="134" width="176" height="44" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="510" y="164" font-size="23" fill="#192c40" text-anchor="middle" font-weight="700">时间维度</text><text x="310" y="198" font-size="18" fill="#43576d" text-anchor="middle" font-weight="400">初期同一分叉通常只能选择一条</text><rect x="158" y="214" width="304" height="43" rx="8" fill="#eaf1f7" stroke="#9eb4c6" stroke-width="1.5"/><text x="310" y="243" font-size="25" fill="#192c40" text-anchor="middle" font-weight="700">节奏分叉</text><path d="M310 258 L110 287" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="22" y="290" width="176" height="44" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="110" y="320" font-size="23" fill="#192c40" text-anchor="middle" font-weight="700">主动</text><path d="M310 258 L310 287" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="222" y="290" width="176" height="44" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="310" y="320" font-size="23" fill="#192c40" text-anchor="middle" font-weight="700">被动</text><path d="M310 258 L510 287" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="422" y="290" width="176" height="44" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="510" y="320" font-size="23" fill="#192c40" text-anchor="middle" font-weight="700">闲置</text><text x="310" y="354" font-size="18" fill="#43576d" text-anchor="middle" font-weight="400">初期同一分叉通常只能选择一条</text><text x="310" y="393" font-size="18" fill="#43576d" text-anchor="middle" font-weight="400">概念分类，不是完整研究树或实际前置图</text>
</svg>
