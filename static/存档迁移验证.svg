<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 479" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">存档迁移验证</title><desc id="desc">导出原档：保留不被覆盖的独立副本；记录来源：平台、版本、阶段与游戏类型；导入测试副本：在目标版本验证，原件不动；核对关键状态：阶段、资源、研究、解锁及自动化；正常保存并重启：重新读取，确认状态保持。发现异常即停止，保护原始备份</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="477" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#23374b">存档迁移验证</text><rect x="42" y="55" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">导出原档</text><text x="310" y="104" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">保留不被覆盖的独立副本</text><path d="M310 117 L310 131" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="133" width="536" height="61" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">记录来源</text><text x="310" y="182" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">平台、版本、阶段与游戏类型</text><path d="M310 195 L310 209" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="211" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="236" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">导入测试副本</text><text x="310" y="260" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">在目标版本验证，原件不动</text><path d="M310 273 L310 287" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="289" width="536" height="61" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="314" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">核对关键状态</text><text x="310" y="338" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">阶段、资源、研究、解锁及自动化</text><path d="M310 351 L310 365" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="367" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="392" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">正常保存并重启</text><text x="310" y="416" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">重新读取，确认状态保持</text><text x="310" y="462" text-anchor="middle" font-size="18" font-weight="400" fill="#23374b">发现异常即停止，保护原始备份</text>
