<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">阶段进度的三层判据</title><desc id="desc">页面可见、按钮可用、真实结算是不同判断层次；以奖励、重置记录和长期资源为证据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310" y="37" text-anchor="middle" font-size="28" font-weight="700" fill="#23374b">阶段进度的三层判据</text><rect x="38" y="62" width="544" height="77" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="92" text-anchor="middle" font-size="26" font-weight="700" fill="#23374b">页面可见</text><text x="310" y="120" text-anchor="middle" font-size="21" font-weight="400" fill="#23374b">仅说明入口已被展示</text><text x="310" y="156" text-anchor="middle" font-size="21" font-weight="700" fill="#23374b">≠</text><rect x="38" y="161" width="544" height="77" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="191" text-anchor="middle" font-size="26" font-weight="700" fill="#23374b">按钮可用</text><text x="310" y="219" text-anchor="middle" font-size="21" font-weight="400" fill="#23374b">当前操作条件可能已满足</text><text x="310" y="255" text-anchor="middle" font-size="21" font-weight="700" fill="#23374b">≠</text><rect x="38" y="260" width="544" height="77" rx="8" fill="#dfeee4" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="290" text-anchor="middle" font-size="26" font-weight="700" fill="#23374b">真实结算</text><text x="310" y="318" text-anchor="middle" font-size="21" font-weight="400" fill="#23374b">核对奖励、重置记录和长期资源</text><text x="310" y="381" text-anchor="middle" font-size="20" font-weight="700" fill="#23374b">显示或可用不能代替真实结算证据</text>
</svg>
