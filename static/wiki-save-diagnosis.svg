<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 401" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">存档兼容的四层边界</title><desc id="desc">编解码：文本能否转换为有效数据；结构检查：玩家对象与必要字段是否存在；迁移：旧字段能否正确转换到当前结构；运行时恢复：阶段、资源、界面与重新读档。逐层取证；解码成功不等于兼容成功</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="399" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#23374b">存档兼容的四层边界</text><rect x="42" y="55" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">编解码</text><text x="310" y="104" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">文本能否转换为有效数据</text><path d="M310 117 L310 131" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="133" width="536" height="61" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">结构检查</text><text x="310" y="182" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">玩家对象与必要字段是否存在</text><path d="M310 195 L310 209" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="211" width="536" height="61" rx="8" fill="#eaf1f7" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="236" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">迁移</text><text x="310" y="260" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">旧字段能否正确转换到当前结构</text><path d="M310 273 L310 287" stroke="#627a91" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="42" y="289" width="536" height="61" rx="8" fill="#edf3ed" stroke="#97aebe" stroke-width="1.5"/><text x="310" y="314" text-anchor="middle" font-size="24" font-weight="700" fill="#23374b">运行时恢复</text><text x="310" y="338" text-anchor="middle" font-size="19" font-weight="400" fill="#23374b">阶段、资源、界面与重新读档</text><text x="310" y="384" text-anchor="middle" font-size="18" font-weight="400" fill="#23374b">逐层取证；解码成功不等于兼容成功</text>
</svg>
