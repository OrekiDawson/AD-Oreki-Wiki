"416" font-size="19" fill="#192c40" text-anchor="middle" font-weight="400">独立机制、特殊现实与限制</text><text x="310" y="462" font-size="18" fill="#43576d" text-anchor="middle" font-weight="400">机制顺序示意；具体解锁条件以版本为准</text>
