<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 479" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">成长阶段与长期资源</title><desc id="desc">反物质阶段：购买维度、提升与星系；无限：大坍缩 → 无限点数（IP）；永恒：永恒结算 → 永恒点数（EP）；现实：现实结算 → 现实机器、符文、复兴点；天神：独立机制、特殊现实与限制。机制顺序示意；具体解锁条件以版本为准</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="477" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
