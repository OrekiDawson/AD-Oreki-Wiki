<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 414" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">尾数与指数</title><desc id="desc">2.5乘十的400次方，与4乘十的3次方相乘，先得到10乘十的403次方，再归一化为1乘十的404次方。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#627a91"/></marker></defs>
<rect x="1" y="1" width="618" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310" y="37" font-size="27" fill="#192c40" text-anchor="middle" font-weight="700">尾数与指数：分开存储</text><rect x="25" y="65" width="270" height="83" rx="8" fill="#eaf1f7" stroke="#9eb4c6" stroke-width="1.5"/><rect x="325" y="65" width="270" height="83" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="160" y="96" font-size="27" fill="#192c40" text-anchor="middle" font-weight="700">尾数 2.5</text><text x="160" y="127" font-size="20" fill="#192c40" text-anchor="middle" font-weight="400">数量级内的比例</text><text x="460" y="96" font-size="27" fill="#192c40" text-anchor="middle" font-weight="700">指数 400</text><text x="460" y="127" font-size="20" fill="#192c40" text-anchor="middle" font-weight="400">十的幂次</text><text x="310" y="188" font-size="29" fill="#192c40" text-anchor="middle" font-weight="700">2.5 × 10⁴⁰⁰</text><path d="M310 203 L310 230" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="233" width="570" height="67" rx="8" fill="#eaf1f7" stroke="#9eb4c6" stroke-width="1.5"/><text x="310" y="260" font-size="25" fill="#192c40" text-anchor="middle" font-weight="700">乘以 4 × 10³</text><text x="310" y="286" font-size="20" fill="#192c40" text-anchor="middle" font-weight="400">尾数相乘，指数相加</text><path d="M310 301 L310 324" fill="none" stroke="#627a91" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="327" width="570" height="67" rx="8" fill="#edf3ed" stroke="#9eb4c6" stroke-width="1.5"/><text x="310" y="354" font-size="26" fill="#192c40" text-anchor="middle" font-weight="700">10 × 10⁴⁰³ → 1 × 10⁴⁰⁴</text><text x="310" y="380" font-size="20" fill="#192c40" text-anchor="middle" font-weight="400">重新归一化</text>
</svg>
